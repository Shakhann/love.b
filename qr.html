<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Салауым 💜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:linear-gradient(160deg,#ffd3e8 0%,#ff9fd0 55%,#f584c0 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Manrope',sans-serif;color:#7a1b6e;padding:24px 16px;
  overflow-x:hidden;position:relative;
}
/* мерцания */
.spark{position:fixed;top:-10px;color:#fff;opacity:.0;pointer-events:none;
  animation:fall linear infinite;text-shadow:0 0 6px rgba(255,255,255,.9)}
@keyframes fall{
  0%{transform:translateY(-5vh) rotate(0deg);opacity:0}
  10%{opacity:.9}
  90%{opacity:.6}
  100%{transform:translateY(108vh) rotate(180deg);opacity:0}
}
h1{
  font-family:'Playfair Display',serif;font-weight:700;
  font-size:clamp(1.9rem,7vw,3rem);
  background:linear-gradient(90deg,#a022be,#d44fa8,#a022be);
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shine 3s linear infinite;
  margin-bottom:6px;
}
@keyframes shine{to{background-position:200% 0}}
.sub{font-size:clamp(.85rem,3.2vw,1.05rem);font-weight:500;color:#8c2f7d;margin-bottom:22px;text-align:center}
.qr-wrap{
  background:rgba(255,255,255,.35);
  border:2px solid rgba(255,255,255,.8);
  border-radius:28px;
  padding:14px;
  box-shadow:0 18px 50px rgba(160,34,190,.25);
  animation:float 4s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.qr-wrap img{display:block;width:min(78vw,380px);height:auto;border-radius:18px}
.hint{
  margin-top:22px;font-weight:700;font-size:clamp(.95rem,3.6vw,1.15rem);
  color:#5e1258;text-align:center;line-height:1.5;
}
.hint .cam{font-size:1.2em}
.url{
  margin-top:10px;font-size:.78rem;font-weight:500;color:rgba(94,18,88,.65);
  word-break:break-all;text-align:center;max-width:80vw;
}
.open{
  margin-top:24px;display:inline-block;
  background:linear-gradient(90deg,#a022be,#c94fae);
  color:#fff;text-decoration:none;font-weight:700;
  font-size:clamp(1rem,4vw,1.2rem);
  padding:14px 44px;border-radius:999px;
  box-shadow:0 10px 28px rgba(160,34,190,.4);
  transition:transform .15s ease, box-shadow .15s ease;
}
.open:active{transform:scale(.96)}
.open:hover{box-shadow:0 14px 34px rgba(160,34,190,.55)}
</style>
</head>
<body>
<h1>Салауым 💜</h1>
<p class="sub">Бұл QR-кодты камерамен сканерле</p>
<div class="qr-wrap"><img src="qr.png" alt="Жүрек QR-код"></div>
<p class="hint"><span class="cam">📷</span> Камераны аш <span class="cam">→</span> QR-ды бағытта <span class="cam">→</span> сайт ашылады <span class="cam">💚</span></p>
<p class="url">shakhann.github.io/love.b</p>
<a class="open" href="index.html">Сайтты ашу →</a>
<script>
/* падающие искры */
const chars = ['✦','✧','⋆','·','♥'];
for (let i = 0; i < 26; i++) {
  const s = document.createElement('span');
  s.className = 'spark';
  s.textContent = chars[i % chars.length];
  s.style.left = Math.random() * 100 + 'vw';
  s.style.fontSize = (8 + Math.random() * 16) + 'px';
  s.style.animationDuration = (5 + Math.random() * 8) + 's';
  s.style.animationDelay = (Math.random() * 8) + 's';
  document.body.appendChild(s);
}
</script>
</body>
</html>
